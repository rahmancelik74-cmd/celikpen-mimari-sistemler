<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bgBalcony" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="paneGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.55" />
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bgBalcony)" />
  <!-- Top & Bottom Aluminum Rails (RAL 7016 Anthracite) -->
  <rect x="45" y="55" width="510" height="24" rx="3" fill="#1E293B" />
  <rect x="45" y="315" width="510" height="26" rx="3" fill="#1E293B" />
  <!-- Lower Parapet / Frosted Glass Rail -->
  <rect x="45" y="341" width="510" height="125" rx="3" fill="#334155" />
  <rect x="57" y="351" width="486" height="105" fill="#CBD5E1" opacity="0.85" />
  <!-- 5 Folding / Thermal Glass Balcony Panels -->
  <g stroke="#0F172A" stroke-width="2.5">
    <rect x="55" y="79" width="94" height="236" fill="url(#paneGlass)" />
    <rect x="153" y="79" width="94" height="236" fill="url(#paneGlass)" />
    <rect x="251" y="79" width="94" height="236" fill="url(#paneGlass)" />
    <rect x="349" y="79" width="94" height="236" fill="url(#paneGlass)" />
    <!-- Slightly Folded 5th Panel -->
    <polygon points="447,79 535,92 535,302 447,315" fill="url(#paneGlass)" stroke="#D91B24" stroke-width="3" />
  </g>
  <!-- Spec Callout Card -->
  <rect x="580" y="55" width="185" height="411" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  <rect x="580" y="55" width="185" height="44" rx="12" fill="#0B1560" />
  <text x="672" y="82" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">VERA &amp; ÇELİKPEN SERİ</text>
  <text x="672" y="130" text-anchor="middle" fill="#0B1560" font-family="sans-serif" font-size="13" font-weight="bold">4+20+4 Argon Isıcam</text>
  <text x="672" y="155" text-anchor="middle" fill="#D91B24" font-family="sans-serif" font-size="13" font-weight="bold">-38 dB Ses Yalıtımı</text>
  <rect x="605" y="175" width="135" height="135" rx="8" fill="#F8FAFC" stroke="#94A3B8" />
  <line x1="635" y1="190" x2="635" y2="295" stroke="#0284C7" stroke-width="6" />
  <line x1="672" y1="190" x2="672" y2="295" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="708" y1="190" x2="708" y2="295" stroke="#0284C7" stroke-width="6" />
  <text x="672" y="335" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="11">TSE EN 12150 Temperli</text>
  <text x="672" y="356" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="11">8 Bilyalı Çelik Rulman</text>
  <text x="672" y="377" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="11">Alüminyum Mıknatıs Fitil</text>
  <rect x="600" y="405" width="145" height="34" rx="6" fill="#D91B24" />
  <text x="672" y="427" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">%72 TERMAL TASARRUF</text>
</svg>
